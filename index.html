<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>EPUB Reader (epub.js)</title>
  <style>
    html,body { height:100%; margin:0; font-family: Arial, sans-serif; }
    #controls { padding:8px; background:#f2f2f2; display:flex; gap:8px; align-items:center; }
    #viewer { height: calc(100% - 50px); }
    button { padding:6px 10px; }
  </style>
  <script src="https://unpkg.com/epubjs/dist/epub.min.js"></script>
</head>
<body>
  <div id="controls">
    <input id="file" type="file" accept=".epub" />
    <button id="prev" disabled>上一页</button>
    <button id="next" disabled>下一页</button>
    <button id="tocBtn" disabled>目录</button>
    <label><input id="night" type="checkbox"> 夜间模式</label>
    <span id="status"></span>
  </div>
  <div id="viewer"></div>

  <script>
    let book, rendition;
    const fileInput = document.getElementById('file');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const tocBtn = document.getElementById('tocBtn');
    const status = document.getElementById('status');
    const night = document.getElementById('night');

    fileInput.addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const url = URL.createObjectURL(f);
      openBook(url);
    });

    function openBook(url) {
      if (rendition) rendition.destroy();
      book = ePub(url);
      status.textContent = '正在加载...';
      rendition = book.renderTo("viewer", { width: "100%", height: "100%" });
      rendition.themes.register("night", {
        "body": { "background": "#111", "color": "#ddd" }
      });
      rendition.display().then(() => {
        status.textContent = '';
        prevBtn.disabled = false;
        nextBtn.disabled = false;
        tocBtn.disabled = false;
      });
      // update location
      book.on("renderer:locationChanged", (loc) => {
        // optional: update progress or URL hash
      });
    }

    prevBtn.addEventListener('click', () => rendition.prev());
    nextBtn.addEventListener('click', () => rendition.next());
    tocBtn.addEventListener('click', async () => {
      const toc = await book.loaded.navigation;
      if (!toc || !toc.toc) return alert('无目录信息');
      const list = toc.toc.map((item, i) => `${i+1}. ${item.label}`).join('\n');
      const pick = prompt('目录:\n' + list + '\n\n输入章节序号跳转');
      const idx = parseInt(pick) - 1;
      if (!isNaN(idx) && toc.toc[idx]) rendition.display(toc.toc[idx].href);
    });

    night.addEventListener('change', () => {
      if (night.checked) rendition.themes.select("night");
      else rendition.themes.select();
    });
  </script>
</body>
</html>
